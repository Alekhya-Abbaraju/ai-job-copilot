spring.application.name=resume-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_job_copilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
server.port=8082

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.resume.storage.type=${RESUME_STORAGE_TYPE:local}
app.resume.storage.local-dir=${RESUME_STORAGE_DIR:./uploads/resumes}

app.resume.storage.s3.bucket=${RESUME_S3_BUCKET:}
app.resume.storage.s3.region=${AWS_REGION:ap-south-1}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Kafka Topics
app.kafka.topics.resume-analysis-requests=resume-analysis-requests

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Spring AI - Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.temperature=0.2

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=resume-analysis-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.alekhya.resume_service.kafka.event.ResumeAnalysisEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.alekhya.resume_service.kafka.event
# Allow long-running AI resume analysis
spring.kafka.consumer.properties[max.poll.interval.ms]=900000

# Process one message per poll
spring.kafka.consumer.max-poll-records=1